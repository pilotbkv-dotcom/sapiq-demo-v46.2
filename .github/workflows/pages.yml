# Sapiq v46.1 — deploy all website and PWA assets from site.zip.
# In GitHub, save this file as .github/workflows/pages.yml
name: Deploy Sapiq to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract and verify Sapiq
        shell: bash
        run: |
          set -euo pipefail
          test -s site.zip
          unzip -tq site.zip
          mkdir -p _site
          unzip -q site.zip -d _site
          for file in index.html ru/index.html en/index.html es/index.html zh/index.html ru/terminal/index.html terminal/index.html pwa/index.html site/assets/v46_terminal.js; do
            test -s "_site/$file" || { echo "Missing required file: $file"; exit 1; }
          done
          test -f _site/.nojekyll
          count="$(find _site -type f | wc -l)"
          echo "Verified $count site files"
          test "$count" -ge 266

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
